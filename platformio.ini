; =============================================================================
; ESP32 4G LTE A7672 MODULE — PlatformIO project
; Board: ESP32 + SIM7672S / A7672S (VVM501 class) cellular modem
; Stack: TinyGSM + PubSubClient + FreeRTOS dual-task MQTT publisher
;
; QUICK START:
;   1. Copy data/config.local.env.example -> data/config.local.env
;   2. Fill YOUR MQTT / device settings in config.local.env
;   3. pio run -t uploadfs && pio run -t upload
;   4. pio device monitor
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DTINY_GSM_MODEM_SIM7600
	-DCORE_DEBUG_LEVEL=3
	-DMQTT_MAX_PACKET_SIZE=4096
	-DMQTT_MAX_TRANSFER_SIZE=128
lib_deps =
	bblanchon/ArduinoJson@^6.21
	vshymanskyy/TinyGSM@^0.11.7
	knolleary/PubSubClient@^2.8
board_build.filesystem = spiffs
